<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ app_name }} - Fitness Planner</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='styles.css') }}"
    >
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🏋️ {{ app_name }}</h1>

            <p class="subtitle">
                Create your personalized 7-day workout plan
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form
                action="/generate-workout"
                method="post"
            >

                <div class="form-group">
                    <label for="username">
                        Name
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="user_id">
                        User ID
                    </label>

                    <input
                        type="text"
                        id="user_id"
                        name="user_id"
                        placeholder="Example: user001"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="13"
                        max="100"
                        placeholder="Enter your age"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="weight">
                        Weight (kg)
                    </label>

                    <input
                        type="number"
                        id="weight"
                        name="weight"
                        min="20"
                        max="500"
                        step="0.1"
                        placeholder="Example: 65"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="goal">
                        Fitness Goal
                    </label>

                    <select
                        id="goal"
                        name="goal"
                        required
                    >
                        <option value="">
                            Select your goal
                        </option>

                        <option value="weight loss">
                            Weight Loss
                        </option>

                        <option value="muscle gain">
                            Muscle Gain
                        </option>

                        <option value="general wellness">
                            General Wellness
                        </option>

                        <option value="flexibility">
                            Flexibility
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="intensity">
                        Workout Intensity
                    </label>

                    <select
                        id="intensity"
                        name="intensity"
                        required
                    >
                        <option value="">
                            Select intensity
                        </option>

                        <option value="low">
                            Low
                        </option>

                        <option value="moderate">
                            Moderate
                        </option>

                        <option value="high">
                            High
                        </option>
                    </select>
                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Generate My Workout Plan
                </button>

            </form>

        </div>


        <div class="admin-link">
            <a href="/view-all-users">
                View All Users
            </a>
        </div>

    </div>

</body>
</html>
